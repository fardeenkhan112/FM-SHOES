<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Naz Boot House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="loader"><div class="loader-content"><h2>NAZ BOOT HOUSE</h2><div class="loader-spinner"></div></div></div>
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo"><span class="fm">NAZ</span> BOOT HOUSE</a>
            <ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li></ul>
            <div class="nav-actions"><a href="cart.html" class="nav-btn"><i class="fas fa-bag-shopping"></i></a><button class="hamburger" id="hamburger"><span></span><span></span><span></span></button></div>
        </div>
    </nav>
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <div class="mobile-menu" id="mobileMenu"><a href="index.html">Home</a><a href="products.html">Products</a></div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="auth-page">
        <div class="auth-card" id="authCard">
            <div class="auth-card-header">
                <div class="auth-logo"><span class="fm">NAZ</span> BOOT HOUSE</div>
                <h2>Create Account</h2>
                <p class="subtitle">Join Naz Boot House today</p>
            </div>
            <form onsubmit="handleSignup(event)">
                <div class="form-group"><label><i class="fas fa-user"></i> Full Name</label><input type="text" class="form-input" id="signupName" placeholder="Your full name"><span class="form-error" id="signupNameErr"></span></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email Address</label><input type="email" class="form-input" id="signupEmail" placeholder="you@example.com"><span class="form-error" id="signupEmailErr"></span></div>
                <div class="form-group"><label><i class="fas fa-lock"></i> Password</label><div class="password-wrapper"><input type="password" class="form-input" id="signupPassword" placeholder="Min 6 characters"><button type="button" class="toggle-pw" onclick="togglePw('signupPassword',this)"><i class="fas fa-eye"></i></button></div><span class="form-error" id="signupPasswordErr"></span></div>
                <button type="submit" class="btn-full"><i class="fas fa-user-plus"></i>&nbsp; Create Account</button>
            </form>
            <div class="auth-divider"><span>or</span></div>
            <button class="btn-google" onclick="handleGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                Continue with Google
            </button>
            <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
